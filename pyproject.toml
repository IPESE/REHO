[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "REHO"
keywords = ["MILP", "MOO decision support", "sustainable energy systems", "energy communities"]
dynamic = ['version']
description = "Renewable Energy Hub Optimizer (REHO) - A Decision Support Tool for Renewable Energy Communities"
license = {text = "Apache-2.0"}
authors = [
    {name = "Dorsan Lepour", email = "dorsan.lepour@epfl.ch"},
]
maintainers = [
    {name = "IPESE-IT", email = "it.ipese@epfl.ch"},
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering"
]
dependencies = [
    "amplpy==0.15.2",
    "ampl_module_base",
    "ampl_module_highs",
    "coloredlogs",
    "geopandas",
    "kaleido",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas>=3.0.0",
    "plotly",
    "psycopg2-binary<3.0.0",
    "pvlib==0.13.0",
    "pyclustering",
    "pyproj",
    "python-dotenv",
    "qmcpy",
    "requests",
    "SALib",
    "scipy",
    "setuptools",
    "shapely",
    "sqlalchemy>=2.0.0",
    "sympy",
    "urllib3<2"
]

# Optional dependency groups. Install with, e.g., `pip install "REHO[dev]"`.
[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov",
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinxcontrib-bibtex",
    "myst-parser",
]
dev = [
    "REHO[test,docs]",
    "pyflakes",
    "ruff",
]

[project.urls]
"Documentation" = "https://reho.readthedocs.io/"
"Repository" = "https://github.com/IPESE/REHO"
"Download" = "https://pypi.org/project/REHO"
"Changelog" = "https://github.com/IPESE/REHO/blob/main/CHANGELOG.md"
"Issues" = "https://github.com/IPESE/REHO/issues"

[project.scripts]
reho-test-import = "reho.test.test_import:test_import_reho_modules"
reho-test-run = "reho.test.test_run:test_run"
reho-download-examples = "reho.test.test_examples:test_download_examples"

# `reho` and every sub-package must be listed, otherwise only the top-level
# package reaches the wheel.
[tool.setuptools.packages.find]
include = ["reho*"]
namespaces = false

# Non-Python files (AMPL model, reference data) shipped inside the package.
# The key is the package name, which is `reho` in lower case - `REHO` matches nothing.
[tool.setuptools.package-data]
"reho" = ["*.csv", "*.xlsx", "*.dat", "*.txt", "*.mod", "*.ini", "*.run"]

[tool.setuptools_scm]
version_scheme = "post-release"

[tool.pytest.ini_options]
testpaths = ["reho/test"]
# Tests that need an AMPL license, a solver or network access are marked; the
# default run stays offline and fast.
markers = [
    "slow: solves an optimization problem; takes minutes",
    "needs_ampl: requires a working AMPL license and solver",
    "needs_network: requires internet access (QBuildings, PVGIS, ELCOM)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
# E501 (line length) is handled by line-length above; the scientific code uses
# short names (h, u, l, dT) that N806-style rules would flag on every line.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B008"]

[tool.ruff.lint.per-file-ignores]
"reho/test/*" = ["B011"]
