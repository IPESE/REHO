name: Upload Python Package

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
    - name: Extract changelog section
      id: changelog
      run: |
        VERSION="${GITHUB_REF_NAME}"
        NOTES_FILE="$(mktemp)"
        awk -v version="$VERSION" '
          /^## \[/ {
            if (found) exit
            if ($0 ~ ("^## \\[" version "\\]")) { found = 1; next }
            next
          }
          found { print }
        ' CHANGELOG.md > "$NOTES_FILE"
        if [ ! -s "$NOTES_FILE" ]; then
          echo "No changelog section found for $VERSION; falling back to auto-generated notes." >&2
          echo "generate=true" >> "$GITHUB_OUTPUT"
        else
          echo "generate=false" >> "$GITHUB_OUTPUT"
        fi
        echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }}
        body_path: ${{ steps.changelog.outputs.generate == 'false' && steps.changelog.outputs.notes_file || null }}
        generate_release_notes: ${{ steps.changelog.outputs.generate == 'true' }}
